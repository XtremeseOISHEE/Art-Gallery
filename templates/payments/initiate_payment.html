{% extends 'base.html' %}
{% block content %}
<h2>Payment for Order #{{ order.id }}</h2>
<p>Total Amount: {{ order.total_price }}৳</p>

<form method="post">
  {% csrf_token %}
  <label><input type="radio" name="method" value="bkash" required> bKash</label><br>
  <label><input type="radio" name="method" value="paypal"> PayPal</label><br>
  <label><input type="radio" name="method" value="card"> Card</label><br>
  <label><input type="radio" name="method" value="cod"> Cash on Delivery</label><br>

  <button type="submit">Confirm Payment</button>
</form>
{% endblock %}
