{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <div class="card bg-dark text-light shadow-sm p-4 text-center">
    <h2 class="mb-4">Payment for Order #{{ order.id }}</h2>
    <p class="fs-5 mb-4">Total Amount: <strong>{{ order.total_price }}৳</strong></p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3 text-start">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="method" value="bkash" id="bkash" required>
          <label class="form-check-label" for="bkash">bKash</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="method" value="paypal" id="paypal">
          <label class="form-check-label" for="paypal">PayPal</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="method" value="card" id="card">
          <label class="form-check-label" for="card">Card</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="method" value="cod" id="cod">
          <label class="form-check-label" for="cod">Cash on Delivery</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Confirm Payment</button>
    </form>
  </div>
</div>
{% endblock %}
