{% extends 'base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
  <div class="card bg-dark text-light shadow rounded-4 p-4 text-center">
    <h3 class="mb-3 text-success">✅ Password Changed Successfully</h3>
    <p class="fs-5">Your password has been updated.</p>
    <p class="mt-3">
      <a href="{% url 'login' %}" class="btn btn-outline-light fw-semibold">🔐 Log In Again</a>
    </p>
  </div>
</div>
{% endblock %}
