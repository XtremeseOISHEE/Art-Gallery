{% extends 'base.html' %}

{% block title %}Register - Art Gallery{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
  <div class="card bg-dark text-light shadow rounded-4 p-4">
    <h3 class="text-center mb-4">🖼️ Create an Account</h3>

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="btn btn-success w-100 fw-semibold">Register</button>
    </form>

    <div class="text-center mt-4">
      <p>Already have an account? 
        <a href="{% url 'login' %}" class="link-info">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
