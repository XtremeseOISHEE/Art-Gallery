{% extends 'base.html' %}

{% block title %}Login - Art Gallery{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 450px;">
  <div class="card bg-dark text-light shadow rounded-4 p-4">
    <h3 class="text-center mb-4">🎨 Login to Your Account</h3>

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="btn btn-primary w-100 fw-semibold">🔐 Login</button>
    </form>

    {% if error %}
      <div class="alert alert-danger mt-3">{{ error }}</div>
    {% endif %}

    <div class="text-center mt-4">
      <p class="mb-1">Don't have an account? 
        <a href="{% url 'register' %}" class="link-info">Register</a>
      </p>
      <p>
        <a href="{% url 'password_reset' %}" class="link-light">Forgot Password?</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
