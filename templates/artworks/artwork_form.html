{% extends 'base.html' %}

{% block title %}Upload / Edit Artwork{% endblock %}

{% block content %}
<style>
    .artwork-form-container {
        background: #0f0f1a;
        padding: 40px;
        border-radius: 20px;
        max-width: 700px;
        margin: auto;
        color: #e0e0e0;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
        font-family: 'Montserrat', sans-serif;
    }

    .artwork-form-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #00b39f;  /* softer teal without glow */
        font-weight: 700;
        /* text-shadow removed */
    }

    .artwork-form-container form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .artwork-form-container input,
    .artwork-form-container textarea,
    .artwork-form-container select {
        width: 100%;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 10px;
        background: #1a1a2e;
        color: #f5f5f5;
    }

    .artwork-form-container input::placeholder,
    .artwork-form-container textarea::placeholder {
        color: #888;
    }

    .artwork-form-container button {
        padding: 12px;
        background: linear-gradient(135deg, #00b39f, #005d7a);
        color: #fff;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .artwork-form-container button:hover {
        transform: scale(1.03);
        box-shadow: 0 0 15px #00b39f;
    }
</style>
<!--  -->
<!-- <div class="mb-3">
  <label for="id_art_type">Select Art Type:</label>
  {{ form.art_type }}
</div> -->
<!--  -->
<div class="artwork-form-container">
    <h2>Upload / Edit Artwork</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Artwork</button>
    </form>
</div>
{% endblock %}
